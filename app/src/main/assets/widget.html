<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-font-smoothing: antialiased;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  }
  html, body {
    width: 364px;
    height: 176px;
    min-height: 0;
    overflow: hidden;
    background: transparent;
  }
  .w-card {
    width: 364px;
    height: 176px;
    border-radius: 24px;
    padding: 15px 18px 13px;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    color: #ffffff;
    background: linear-gradient(180deg, #1b64ba 0%, #388be0 52%, #5ea5ec 100%);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.24), inset 0 1px 0 rgba(255,255,255,0.34);
  }

  /* Theme: iOS (Dễ nhìn) */
  .w-card[data-theme="ios"][data-sky="day"] {
    background: linear-gradient(180deg, #1a60b6 0%, #3586dc 52%, #5ca3eb 100%);
  }
  .w-card[data-theme="ios"][data-sky="night"] {
    background: linear-gradient(180deg, #0d1b3e 0%, #172e60 54%, #24417a 100%);
    box-shadow: inset 0 0 0 1px rgba(191,219,254,0.22), inset 0 1px 0 rgba(255,255,255,0.22);
  }
  .w-card[data-theme="ios"][data-sky="rain"] {
    background: linear-gradient(180deg, #3b4f68 0%, #506682 54%, #677e9b 100%);
  }
  .w-card[data-theme="ios"] .top-row,
  .w-card[data-theme="ios"] .forecast {
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.16);
  }

  /* Theme: Wallpaper (Phù hợp nền tím pastel hiện tại) */
  .w-card[data-theme="wallpaper"] {
    background: linear-gradient(145deg, #543dba 0%, #7c62db 52%, #a884e4 85%, #cb9ede 100%);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.56);
  }
  .w-card[data-theme="wallpaper"] .top-row,
  .w-card[data-theme="wallpaper"] .forecast {
    text-shadow: 0 1px 4px rgba(32, 16, 78, 0.36);
  }

  /* Theme: MCU (Nhân vật MCU, KHÔNG chữ) */
  .w-card[data-theme="mcu"] {
    background: #102046;
    box-shadow: inset 0 0 0 1px rgba(103, 232, 249, 0.40), inset 0 1px 0 rgba(255, 255, 255, 0.28);
  }
  .w-card[data-theme="mcu"] .top-row,
  .w-card[data-theme="mcu"] .forecast {
    text-shadow: 0 1px 5px rgba(0, 0, 0, 0.80);
  }

  /* Extra Bright MCU Themes (KHÔNG chữ) */
  .w-card[data-theme="mcu_ironman"] {
    background: #5a1622;
    box-shadow: inset 0 0 0 1px rgba(252, 211, 77, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.28);
  }
  .w-card[data-theme="mcu_spiderman"] {
    background: #1558b0;
    box-shadow: inset 0 0 0 1px rgba(251, 113, 133, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.34);
  }
  .w-card[data-theme="mcu_thor"] {
    background: #0f2d5e;
    box-shadow: inset 0 0 0 1px rgba(125, 211, 252, 0.48), inset 0 1px 0 rgba(255, 255, 255, 0.34);
  }
  .w-card[data-theme="mcu_strange"] {
    background: #2e1065;
    box-shadow: inset 0 0 0 1px rgba(253, 186, 116, 0.48), inset 0 1px 0 rgba(255, 255, 255, 0.30);
  }
  .w-card[data-theme^="mcu_"] .top-row,
  .w-card[data-theme^="mcu_"] .forecast {
    text-shadow: 0 1px 5px rgba(0, 0, 0, 0.72);
  }

  /* Theme: Doctor Doom (MCU style, KHÔNG chữ) */
  .w-card[data-theme="doom"] {
    background: #0f3b28;
    box-shadow: inset 0 0 0 1px rgba(110, 231, 183, 0.48), inset 0 1px 0 rgba(255, 255, 255, 0.32);
  }
  .w-card[data-theme="doom"] .top-row,
  .w-card[data-theme="doom"] .forecast {
    text-shadow: 0 1px 5px rgba(0, 0, 0, 0.72);
  }

  .bg-layer {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .ios-glow, .wall-glow, .mcu-art, .mcu-scrim, .doom-sky {
    position: absolute;
    inset: 0;
    display: none;
  }
  .w-card[data-theme="ios"] .ios-glow {
    display: block;
    background: radial-gradient(circle at 82% 16%, rgba(255,255,255,0.22), transparent 52%);
  }
  .w-card[data-theme="ios"][data-sky="night"] .ios-glow {
    background: radial-gradient(circle at 80% 18%, rgba(147,197,253,0.18), transparent 54%);
  }
  .w-card[data-theme="wallpaper"] .wall-glow {
    display: block;
    background:
      radial-gradient(circle at 18% 12%, rgba(255,255,255,0.28), transparent 50%),
      radial-gradient(circle at 86% 88%, rgba(244,180,226,0.28), transparent 48%);
  }

    background-size: cover;
    background-position: right center;
  }
  .w-card[data-theme="doom"] .mcu-scrim {
    display: block;
    background:
      linear-gradient(180deg, rgba(7,33,22,0.02) 0%, rgba(7,33,22,0.06) 54%, rgba(7,33,22,0.28) 100%),
      linear-gradient(95deg, rgba(7,33,22,0.34) 0%, rgba(13,56,38,0.10) 48%, rgba(7,33,22,0.02) 100%);
  }

  .cloud-mass { position: absolute; border-radius: 50%; filter: blur(24px); opacity: 0.65; }
  .cloud-1 { width: 240px; height: 95px; background: radial-gradient(circle, rgba(34,255,102,0.22), rgba(10,22,16,0.9) 72%); top: -30px; left: -30px; }
  .cloud-2 { width: 220px; height: 85px; background: radial-gradient(circle, rgba(57,255,20,0.16), rgba(8,16,12,0.88) 70%); top: -18px; right: -40px; }
  .ruins-silhouette { position: absolute; bottom: 0; left: 0; width: 100%; height: 50px; opacity: 0.32; }
  .rain-canvas { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.48; }

  .top-row {
    position: relative;
    z-index: 2;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    height: 76px;
    flex-shrink: 0;
  }
  .left-col { display: flex; flex-direction: column; max-width: 68%; }
  .location-line {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 15.5px;
    font-weight: 600;
    letter-spacing: -0.25px;
    line-height: 19px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .location-arrow { width: 10px; height: 10px; flex-shrink: 0; transform: translateY(-0.5px); }
  .current-temp {
    font-size: 48px;
    font-weight: 300;
    line-height: 50px;
    letter-spacing: -2.4px;
    margin-top: 1px;
  }
  .right-col {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    text-align: right;
    padding-top: 2px;
  }
  .main-icon { width: 20px; height: 20px; margin-bottom: 5px; display: flex; align-items: center; justify-content: center; }
  .main-icon svg { width: 20px; height: 20px; }
  .condition-text, .high-low {
    font-size: 13px;
    line-height: 16.5px;
    letter-spacing: -0.1px;
    font-weight: 500;
  }
  .high-low { display: flex; gap: 5px; opacity: 0.94; }

  .forecast {
    position: relative;
    z-index: 2;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    width: 100%;
    margin-top: 2px;
  }
  .hour {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    gap: 7px;
    min-width: 36px;
  }
  .hour-time {
    font-size: 11px;
    line-height: 13px;
    color: rgba(255, 255, 255, 0.80);
    font-weight: 600;
  }
  .hour-icon {
    height: 21px;
    width: 21px;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .hour-icon svg { width: 21px; height: 21px; }
  .hour-temp {
    font-size: 13.5px;
    line-height: 15px;
    font-weight: 600;
  }
  .unavailable {
    position: relative;
    z-index: 2;
    font-size: 12.5px;
    line-height: 18px;
    color: rgba(255, 255, 255, 0.88);
    padding-bottom: 10px;
  }
</style>
</head>
<body>
<div class="w-card" id="weatherWidget" data-theme="ios" data-sky="day">
  <div class="bg-layer">
    <div class="ios-glow"></div>
    <div class="wall-glow"></div>
    <div class="mcu-art"></div>
    <div class="mcu-scrim"></div>
    <div class="doom-sky">
      <div class="cloud-mass cloud-1"></div>
      <div class="cloud-mass cloud-2"></div>
      <svg class="ruins-silhouette" viewBox="0 0 364 50" preserveAspectRatio="none">
        <path d="M0 50 L0 28 L18 20 L28 32 L48 14 L64 18 L74 34 L102 26 L124 10 L144 16 L156 36 L192 24 L216 12 L232 20 L248 35 L286 22 L312 8 L330 18 L346 30 L364 23 L364 50 Z" fill="#0a1a13"/>
        <path d="M175 50 L184 34 L204 26" stroke="#39ff14" stroke-width="1" fill="none" opacity="0.5"/>
      </svg>
    </div>
    <canvas class="rain-canvas" id="rainCanvas"></canvas>
  </div>

  <div class="top-row">
    <div class="left-col">
      <div class="location-line">
        <span id="wCity">Tokyo</span>
      </div>
      <div class="current-temp" id="wTemp">—°</div>
    </div>
    <div class="right-col">
      <div class="main-icon" id="wMainIcon"></div>
      <div class="condition-text" id="wCond"></div>
      <div class="high-low"><span id="wHi"></span><span id="wLo"></span></div>
    </div>
  </div>

  <div class="forecast" id="forecast"></div>
  <div class="unavailable" id="unavailable" style="display:none"></div>
</div>

<script>
const icons = {
  sun: '<svg viewBox="0 0 24 24" fill="#FFD60A"><circle cx="12" cy="12" r="5"/><path d="M12 1.5v2.2m0 16.6v2.2M4.58 4.58l1.55 1.55m11.74 11.74 1.55 1.55M1.5 12h2.2m16.6 0h2.2M4.58 19.42l1.55-1.55m11.74-11.74 1.55-1.55" stroke="#FFD60A" stroke-width="2" stroke-linecap="round"/></svg>',
  moon: '<svg viewBox="0 0 24 24" fill="#E5EEFF"><path d="M20.5 14.2A8.8 8.8 0 0 1 9.8 3.5a9.1 9.1 0 1 0 10.7 10.7Z"/></svg>',
  suncloud: '<svg viewBox="0 0 24 24" fill="none"><circle cx="9.2" cy="9.2" r="3.6" fill="#FFD60A"/><path d="M18.2 17.5H8.8a4 4 0 0 1-.4-7.98 5.4 5.4 0 0 1 10.6 1.58 3.2 3.2 0 0 1-.8 6.4Z" fill="#F3F4F6"/></svg>',
  mooncloud: '<svg viewBox="0 0 24 24" fill="none"><path d="M12.2 4.2a4.6 4.6 0 0 0 4.6 5.2 4.8 4.8 0 0 1-5.8 3.6 4.7 4.7 0 0 1 1.2-8.8Z" fill="#DCE8FF"/><path d="M18.2 18H8.6a3.8 3.8 0 0 1-.4-7.58 5.2 5.2 0 0 1 10.2 1.48A3.1 3.1 0 0 1 18.2 18Z" fill="#E5E7EB"/></svg>',
  cloud: '<svg viewBox="0 0 24 24" fill="none"><path d="M17.8 17H7.2a4.4 4.4 0 0 1-.4-8.78 6.2 6.2 0 0 1 12.2 1.78A3.5 3.5 0 0 1 17.8 17Z" fill="#E5E7EB"/></svg>',
  rain: '<svg viewBox="0 0 24 24" fill="none"><path d="M17.6 15H7.2a4.2 4.2 0 0 1-.4-8.38A6 6 0 0 1 18.8 8.5a3.3 3.3 0 0 1-1.2 6.5Z" fill="#E5E7EB"/><path d="M8.5 17.8l-1 3M12.5 17.8l-1 3M16.5 17.8l-1 3" stroke="#64D2FF" stroke-width="1.9" stroke-linecap="round"/></svg>',
  snow: '<svg viewBox="0 0 24 24" fill="none"><path d="M17.6 15H7.2a4.2 4.2 0 0 1-.4-8.38A6 6 0 0 1 18.8 8.5a3.3 3.3 0 0 1-1.2 6.5Z" fill="#E5E7EB"/><circle cx="8.5" cy="18.8" r="1.2" fill="#BAE6FD"/><circle cx="12.5" cy="20.2" r="1.2" fill="#BAE6FD"/><circle cx="16.5" cy="18.8" r="1.2" fill="#BAE6FD"/></svg>',
  storm: '<svg viewBox="0 0 24 24" fill="none"><path d="M17.6 14.5H7.2a4.2 4.2 0 0 1-.4-8.38A6 6 0 0 1 18.8 8a3.3 3.3 0 0 1-1.2 6.5Z" fill="#E5E7EB"/><polygon points="12.6,14 9.2,19 12,19 10.8,23.2 15.8,17.2 12.8,17.2" fill="#FACC15"/></svg>'
};

function weatherIcon(code, day) {
  const isDay = day === undefined ? true : Boolean(day);
  if (code === 0) return isDay ? icons.sun : icons.moon;
  if (code <= 2) return isDay ? icons.suncloud : icons.mooncloud;
  if (code === 3 || code === 45 || code === 48) return icons.cloud;
  if ((code >= 71 && code <= 77) || code === 85 || code === 86) return icons.snow;
  return code >= 95 ? icons.storm : icons.rain;
}

function skyFor(code, day) {
  if (code >= 51 || code === 3 || code === 45 || code === 48) return 'rain';
  return day === 0 ? 'night' : 'day';
}

function renderWidget(d) {
  const card = document.getElementById('weatherWidget');
  const VALID_W = new Set(['ios','wallpaper','mcu','mcu_ironman','mcu_spiderman','mcu_thor','mcu_strange','doom']);
  const theme = VALID_W.has(d.theme) ? d.theme : 'ios';
  card.dataset.theme = theme;
  card.dataset.sky = d.temp === undefined ? 'day' : skyFor(d.code, d.day);

  document.getElementById('wCity').textContent = d.name || '';
  const forecast = document.getElementById('forecast');
  const unavail = document.getElementById('unavailable');
  forecast.replaceChildren();

  if (d.temp === undefined) {
    forecast.style.display = 'none';
    unavail.style.display = 'block';
    unavail.textContent = d.offline ? 'Không tải được thời tiết. Chạm để thử lại.' : 'Đang tải thời tiết…';
    return;
  }

  document.getElementById('wTemp').textContent = d.temp + '°';
  document.getElementById('wMainIcon').innerHTML = weatherIcon(d.code, d.day);
  document.getElementById('wCond').textContent = d.condition || '';
  document.getElementById('wHi').textContent = 'C:' + d.high + '°';
  document.getElementById('wLo').textContent = 'T:' + d.low + '°';

  if (d.stale || !d.hours || d.hours.length !== 6) {
    forecast.style.display = 'none';
    unavail.style.display = 'block';
    unavail.textContent = d.stale ? 'Dữ liệu cũ · Chạm để cập nhật' : 'Chưa có dự báo theo giờ';
    return;
  }

  unavail.style.display = 'none';
  forecast.style.display = 'flex';
  for (const hour of d.hours) {
    const column = document.createElement('div'); column.className = 'hour';
    const time = document.createElement('div'); time.className = 'hour-time';
    time.textContent = new Date((hour.time + d.utcOffset) * 1000).getUTCHours() + 'h';
    const icon = document.createElement('div'); icon.className = 'hour-icon';
    icon.innerHTML = weatherIcon(hour.code, hour.day);
    const temp = document.createElement('div'); temp.className = 'hour-temp';
    temp.textContent = hour.temp + '°';
    column.append(time, icon, temp);
    forecast.append(column);
  }

  const canvas = document.getElementById('rainCanvas');
  canvas.width = 364; canvas.height = 176;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, 364, 176);
  if (d.code >= 51 && d.code < 95) {
    ctx.strokeStyle = theme === 'doom' ? 'rgba(157,245,184,.14)' : 'rgba(200,232,255,.16)';
    ctx.lineWidth = 0.7;
    for (let i = 0; i < 24; i++) {
      const x = (i * 47) % 364, y = (i * 31) % 176;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 2, y + 9); ctx.stroke();
    }
  }
}
</script>
</body>
</html>
